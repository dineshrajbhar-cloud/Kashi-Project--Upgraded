spring.application.name=kashi-tourism-backend

# Optional local .env file (KEY=value lines). Real environment variables are used when it is absent.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# MySQL. useSSL=false is for local development; enable SSL for a real deployment.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kashi_tourism}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# The schema is managed by Flyway. Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Application settings (checked at startup, see JwtService and AdminInitializer)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

logging.level.root=INFO
logging.level.com.kashi.portal=INFO

# Gallery image storage
app.upload.dir=${UPLOAD_DIR:uploads/gallery}
app.upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}

# Groq AI Configuration
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

